{% extends "blog/base.html" %}
{% block content %}
  <h2>Posts tagged "{{ tag_name }}"</h2>
  {% if posts %}
    <ul>
      {% for post in posts %}
        <li><a href="{% url 'post-detail' post.pk %}">{{ post.title }}</a> — {{ post.created_at|date:"M d, Y" }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No posts for this tag yet.</p>
  {% endif %}
{% endblock %}
