{% extends "blog/base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
  <h1>Welcome to the Django Blog</h1>
  {% if user.is_authenticated %}
    <p>Hello {{ user.username }} — go to your <a href="{% url 'profile' %}">profile</a>.</p>
  {% else %}
    <p>Welcome guest — <a href="{% url 'login' %}">log in</a> or <a href="{% url 'register' %}">register</a>.</p>
  {% endif %}
{% endblock %}
