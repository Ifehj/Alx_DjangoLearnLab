{% extends "blog/base.html" %}
{% load static %}
{% block title %}Comment{% endblock %}
{% block content %}
  <h2>{% if form.instance.pk %}Edit Comment{% else %}Add Comment{% endif %}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if form.instance.pk %}Save{% else %}Post Comment{% endif %}</button>
    <a href="{% if form.instance.pk %}{% url 'post-detail' form.instance.post.pk %}{% else %}{% url 'post-detail' post_pk %}{% endif %}">Cancel</a>
  </form>
{% endblock %}
